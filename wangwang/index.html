<style>
:root{color-scheme: light dark;}
*{box-sizing:border-box;}
html,body{margin:0; padding:0;}
img{max-width:100%;}
[hidden]{display:none!important;}
/* ============ Tokens ============ */
:root{
  --ground:#F1E9D2;
  --scene-sky-a:#DDE4C0;
  --scene-sky-b:#9FB57F;
  --surface:#FBF7E9;
  --surface-2:#E7DAB6;
  --surface-3:#D9C696;
  --border:#C1AB74;
  --ink:#262F1E;
  --ink-soft:#5A6247;
  --ink-faint:#8A9070;
  --accent:#3F6B45;
  --accent-deep:#2E5233;
  --accent-ink:#F3EFDC;
  --leaf:#8A9A3E;
  --leaf-soft:#E7E6C4;
  --sky:#4C7A93;
  --sky-soft:#DCE6E6;
  --alert:#A0472B;
  --alert-soft:#EAD8C8;
  --plum:#8A6A3F;
  --plum-soft:#E9DCC0;
  --rust:#B5652F;
  --rust-soft:#EFDBBF;
  --shadow: 0 10px 30px -12px rgba(38,47,30,.32);
  --shadow-sm: 0 2px 8px -2px rgba(38,47,30,.2);
  --radius-lg:22px;
  --radius-md:14px;
  --radius-sm:9px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:28px; --sp-7:36px;
  --fs-xs:11.5px; --fs-sm:13px; --fs-base:14.5px; --fs-md:16.5px; --fs-lg:19px; --fs-xl:25px; --fs-2xl:32px;
  --font-display:'Noto Sans TC','Microsoft JhengHei',sans-serif;
  --font-body:'Noto Sans TC','Microsoft JhengHei',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#151A11;
    --scene-sky-a:#1B2314;
    --scene-sky-b:#0D110A;
    --surface:#202719;
    --surface-2:#29331F;
    --surface-3:#333F26;
    --border:#44502E;
    --ink:#ECE6CF;
    --ink-soft:#B4BB98;
    --ink-faint:#7B8464;
    --accent:#7FA36A;
    --accent-deep:#9BC17E;
    --accent-ink:#13190F;
    --leaf:#B7C168;
    --leaf-soft:#2A3120;
    --sky:#8FB7C9;
    --sky-soft:#20302F;
    --alert:#D98863;
    --alert-soft:#3A2418;
    --plum:#C6AD7C;
    --plum-soft:#31281A;
    --rust:#DE9A5E;
    --rust-soft:#392A18;
    --shadow: 0 14px 34px -14px rgba(0,0,0,.6);
    --shadow-sm: 0 2px 10px -2px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --ground:#151A11;
  --scene-sky-a:#1B2314;
  --scene-sky-b:#0D110A;
  --surface:#202719;
  --surface-2:#29331F;
  --surface-3:#333F26;
  --border:#44502E;
  --ink:#ECE6CF;
  --ink-soft:#B4BB98;
  --ink-faint:#7B8464;
  --accent:#7FA36A;
  --accent-deep:#9BC17E;
  --accent-ink:#13190F;
  --leaf:#B7C168;
  --leaf-soft:#2A3120;
  --sky:#8FB7C9;
  --sky-soft:#20302F;
  --alert:#D98863;
  --alert-soft:#3A2418;
  --plum:#C6AD7C;
  --plum-soft:#31281A;
  --rust:#DE9A5E;
  --rust-soft:#392A18;
  --shadow: 0 14px 34px -14px rgba(0,0,0,.6);
  --shadow-sm: 0 2px 10px -2px rgba(0,0,0,.5);
}

*{box-sizing:border-box;}
html{font-size:16px;}
body{
  background:
    radial-gradient(ellipse 90% 60% at 50% 0%, var(--scene-sky-a), var(--scene-sky-b) 75%);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:var(--fs-base);
  line-height:1.55;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:var(--font-display); font-weight:800; text-wrap:balance;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit; font-size:inherit; color:inherit;}
::selection{background:var(--accent); color:var(--accent-ink);}
a{color:inherit;}

/* ============ Backdrop scene ============ */
.scene{
  position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
}
.scene svg{position:absolute; bottom:0; left:0; width:100%; height:auto;}
.scene .stars{position:absolute; inset:0; opacity:.5;}

/* ============ App shell ============ */
.app-wrap{
  position:relative; z-index:1;
  min-height:100vh;
  display:flex; align-items:flex-start; justify-content:center;
  padding:var(--sp-6) var(--sp-4) 0;
}
.app-shell{
  width:100%; max-width:452px;
  background:var(--ground);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow);
  border:1px solid var(--border);
  min-height:min(884px, 100vh - 48px);
  display:flex; flex-direction:column;
  overflow:hidden;
  position:relative;
}
@media (max-width:540px){
  .app-wrap{padding:0;}
  .app-shell{border-radius:0; border:none; min-height:100vh;}
}

/* ---- header ---- */
.app-header{
  display:flex; align-items:center; gap:var(--sp-3);
  padding:var(--sp-4) var(--sp-4) var(--sp-3);
  border-bottom:1px solid var(--border);
  background:var(--surface);
  flex-shrink:0;
}
.brandmark{
  width:38px; height:38px; flex-shrink:0; border-radius:50%;
  background:var(--surface-2); display:flex; align-items:center; justify-content:center;
  border:1px solid var(--border);
}
.brand-text{display:flex; flex-direction:column; line-height:1.15;}
.brand-text .wordmark{font-family:var(--font-display); font-weight:900; font-size:19px; letter-spacing:.01em; color:var(--accent-deep); -webkit-text-stroke:.5px var(--ink); text-stroke:.5px var(--ink);}
.brand-text .tagline{font-size:10.5px; color:var(--ink-faint); letter-spacing:.06em;}
.header-spacer{flex:1;}
.streak-pill{
  display:flex; align-items:center; gap:5px;
  background:var(--surface-2); border:1px solid var(--border);
  border-radius:999px; padding:5px 11px 5px 9px;
  font-family:var(--font-mono); font-size:12.5px; font-weight:700; color:var(--rust);
}
.avatar-btn{
  width:38px; height:38px; border-radius:50%; overflow:hidden; flex-shrink:0;
  border:2px solid var(--accent); background:var(--surface-2); cursor:pointer; padding:0;
}
.avatar-btn svg{display:block; width:100%; height:100%;}
.icon-wrap img, .mascot-wrap img, .avatar-btn img{width:100%; height:100%; object-fit:contain; display:block;}

/* ---- screens ---- */
.screen{
  flex:1; overflow-y:auto; padding:var(--sp-4) var(--sp-4) 100px;
  display:flex; flex-direction:column; gap:var(--sp-5);
  scrollbar-width:thin;
}
.screen[hidden]{display:none!important;}
.screen-title{display:flex; align-items:baseline; justify-content:space-between; gap:var(--sp-3);}
.screen-title h1{font-size:var(--fs-xl); font-weight:700; margin:0;}
.screen-sub{color:var(--ink-soft); font-size:var(--fs-sm); margin-top:2px;}

/* ---- bottom nav ---- */
.bottom-nav{
  position:absolute; left:0; right:0; bottom:0;
  display:grid; grid-template-columns:repeat(4,1fr);
  background:var(--surface); border-top:1px solid var(--border);
  padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));
  flex-shrink:0; z-index:5;
}
.nav-btn{
  display:flex; flex-direction:column; align-items:center; gap:3px;
  background:none; border:none; cursor:pointer; padding:6px 2px;
  color:var(--ink-faint); border-radius:var(--radius-sm);
  transition:color .15s ease, transform .15s ease;
}
.nav-btn svg{width:21px; height:21px;}
.nav-btn span{font-size:10px; font-weight:600; letter-spacing:.01em;}
.nav-btn[aria-current="true"]{color:var(--accent-deep);}
.nav-btn[aria-current="true"] svg{transform:translateY(-1px);}
.nav-btn:active{transform:scale(.92);}

/* ============ Components ============ */
.card{
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius-md); box-shadow:var(--shadow-sm);
}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  border-radius:999px; border:1px solid transparent; cursor:pointer;
  font-weight:700; font-size:var(--fs-sm); padding:11px 20px;
  transition:transform .12s ease, filter .15s ease, opacity .15s ease;
  white-space:nowrap;
}
.btn:active{transform:scale(.96);}
.btn-primary{background:var(--accent-deep); color:#FFFBF3;}
.btn-primary:hover{filter:brightness(1.06);}
:root[data-theme="dark"] .btn-primary, @media (prefers-color-scheme:dark){ .btn-primary{color:var(--accent-ink);} }
.btn-ghost{background:var(--surface-2); color:var(--ink); border-color:var(--border);}
.btn-outline{background:transparent; color:var(--accent-deep); border-color:var(--accent-deep);}
.btn-sm{padding:7px 14px; font-size:12.5px;}
.btn-block{width:100%;}
.btn[disabled]{opacity:.5; cursor:default; transform:none!important;}
.icon-btn{
  width:34px; height:34px; border-radius:50%; border:1px solid var(--border);
  background:var(--surface-2); display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.icon-btn svg{width:16px; height:16px;}

.chip-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; margin:0 -2px;}
.chip-row::-webkit-scrollbar{display:none;}
.chip{
  flex-shrink:0; display:inline-flex; align-items:center; gap:6px;
  border:1px solid var(--border); background:var(--surface); color:var(--ink-soft);
  border-radius:999px; padding:7px 14px; font-size:12.5px; font-weight:600; cursor:pointer;
  transition:background .15s, color .15s, border-color .15s;
}
.chip[aria-pressed="true"]{background:var(--accent-deep); border-color:var(--accent-deep); color:#FFFBF3;}
.chip:disabled{opacity:.45; cursor:default;}
.chip-icon{width:14px; height:14px; display:flex; flex-shrink:0;}
.chip-icon svg{width:100%; height:100%;}
.tag{
  display:inline-flex; align-items:center; gap:4px; border-radius:999px;
  padding:3px 10px; font-size:11px; font-weight:700; letter-spacing:.02em;
}
.tag-vaccine{background:var(--sky-soft); color:var(--sky);}
.tag-rat_poison{background:var(--alert-soft); color:var(--alert);}
.tag-expo{background:var(--rust-soft); color:var(--rust);}
.tag-notice{background:var(--leaf-soft); color:var(--leaf);}
.tag-diary-health{background:var(--sky-soft); color:var(--sky);}
.tag-diary-safety{background:var(--alert-soft); color:var(--alert);}
.tag-diary-activity{background:var(--rust-soft); color:var(--rust);}
.tag-diary-daily{background:var(--leaf-soft); color:var(--leaf);}
.cat-restaurant{background:var(--rust-soft); color:var(--rust);}
.cat-shop{background:var(--sky-soft); color:var(--sky);}
.cat-attraction{background:var(--leaf-soft); color:var(--leaf);}
.cat-vet{background:var(--plum-soft); color:var(--plum);}

.section-label{
  font-size:11px; font-weight:700; letter-spacing:.1em; color:var(--ink-faint); text-transform:uppercase;
}

.empty-note{
  text-align:center; color:var(--ink-faint); font-size:var(--fs-sm); padding:var(--sp-5) 0;
}

/* toast */
.toast{
  position:absolute; left:50%; bottom:96px; transform:translate(-50%,12px);
  background:var(--ink); color:var(--ground); padding:10px 18px; border-radius:999px;
  font-size:13px; font-weight:600; box-shadow:var(--shadow); z-index:60;
  opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
}
.toast.show{opacity:1; transform:translate(-50%,0);}

/* modal */
.modal-backdrop{
  position:absolute; inset:0; background:rgba(20,16,10,.5); backdrop-filter:blur(2px);
  display:flex; align-items:flex-end; z-index:50;
  opacity:0; pointer-events:none; transition:opacity .2s ease;
}
.modal-backdrop.show{opacity:1; pointer-events:auto;}
.modal-sheet{
  background:var(--surface); width:100%; max-height:88%; overflow-y:auto;
  border-radius:22px 22px 0 0; padding:var(--sp-5) var(--sp-4) var(--sp-6);
  transform:translateY(16px); transition:transform .22s ease;
  border-top:1px solid var(--border);
}
.modal-backdrop.show .modal-sheet{transform:translateY(0);}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:var(--sp-4);}
.modal-head h2{font-size:var(--fs-lg); margin:0;}

.field{display:flex; flex-direction:column; gap:6px; margin-bottom:var(--sp-4);}
.field label{font-size:12.5px; font-weight:700; color:var(--ink-soft);}
.field input[type="text"], .field select, .field textarea{
  border:1px solid var(--border); background:var(--surface-2); color:var(--ink);
  border-radius:var(--radius-sm); padding:10px 12px; font-size:14px; resize:vertical;
}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--accent); outline-offset:1px;}
.tagpick{display:flex; flex-wrap:wrap; gap:7px;}

/* ============ Onboarding ============ */
.onboard{
  position:absolute; inset:0; z-index:40; background:var(--ground);
  display:flex; flex-direction:column; padding:var(--sp-6) var(--sp-4) var(--sp-5);
  overflow-y:auto;
}
.onboard-hero{text-align:center; margin-bottom:var(--sp-5);}
.onboard-hero .mascot-wrap{width:96px; height:96px; margin:0 auto var(--sp-3); border-radius:50%; background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow-sm); padding:10px;}
.onboard-hero h1{font-size:28px; margin:0 0 6px;}
.onboard-hero p{color:var(--ink-soft); font-size:var(--fs-sm); max-width:34ch; margin:0 auto;}

.breed-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.breed-card{
  border:2px solid var(--border); background:var(--surface); border-radius:var(--radius-md);
  padding:10px 6px 9px; text-align:center; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px;
}
.breed-card .icon-wrap{width:56px; height:56px; border-radius:10px; overflow:hidden; background:var(--surface-2);}
.breed-card span{font-size:12px; font-weight:700;}
.breed-card[aria-pressed="true"]{border-color:var(--accent-deep); background:var(--surface-2); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);}

/* ============ Home screen ============ */
.greet-card{
  padding:var(--sp-5); display:flex; gap:var(--sp-4); align-items:center;
  background:linear-gradient(135deg, var(--surface-2), var(--surface));
}
.greet-card .icon-wrap{width:64px; height:64px; flex-shrink:0; border-radius:12px; overflow:hidden; background:var(--surface);}
.greet-card h2{font-size:var(--fs-lg); margin:0 0 3px;}
.greet-card p{margin:0; font-size:12.5px; color:var(--ink-soft);}

.stat-row{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.stat-tile{padding:var(--sp-3) var(--sp-2); text-align:center; display:flex; flex-direction:column; align-items:center; gap:4px;}
.stat-tile .stat-icon{width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin-bottom:2px;}
.stat-tile .stat-icon svg{width:18px; height:18px;}
.stat-tile .stat-icon.rust{background:var(--rust-soft); color:var(--rust);}
.stat-tile .stat-icon.leaf{background:var(--leaf-soft); color:var(--leaf);}
.stat-tile .stat-icon.accent{background:var(--sky-soft); color:var(--sky);}
.stat-tile .num{font-family:var(--font-mono); font-weight:700; font-size:20px; color:var(--accent-deep);}
.stat-tile .lbl{font-size:10.5px; color:var(--ink-faint); margin-top:2px;}
.data-card{padding:var(--sp-4); display:flex; gap:var(--sp-3);}
.data-card .icon-wrap{width:44px; height:44px; border-radius:12px; background:var(--leaf-soft); color:var(--leaf); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.data-card .icon-wrap svg{width:22px; height:22px;}
.data-card .d-body{flex:1;}
.data-card .d-title{font-weight:700; font-size:13.5px; margin-bottom:2px;}
.data-card .d-desc{font-size:11.5px; color:var(--ink-faint); margin-bottom:10px;}
.data-card .d-actions{display:flex; gap:8px;}
.bell-btn{
  width:34px; height:34px; border-radius:50%; border:1px solid var(--border);
  background:var(--surface-2); display:flex; align-items:center; justify-content:center; cursor:pointer;
  color:var(--ink-soft); margin-right:6px;
}
.bell-btn svg{width:16px; height:16px;}

.mission-list{display:flex; flex-direction:column; gap:8px;}
.mission-item{
  display:flex; align-items:center; gap:10px; padding:12px 14px;
}
.mission-check{
  width:24px; height:24px; border-radius:50%; border:2px solid var(--border); flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
}
.mission-item.done .mission-check{background:var(--leaf); border-color:var(--leaf);}
.mission-item.done .mission-check svg{width:13px; height:13px; stroke:#fff;}
.mission-item .m-text{flex:1;}
.mission-item .m-title{font-size:13.5px; font-weight:600;}
.mission-item.done .m-title{color:var(--ink-faint); text-decoration:line-through;}
.mission-item .m-desc{font-size:11.5px; color:var(--ink-faint);}
.progress-bar{height:8px; border-radius:999px; background:var(--surface-3); overflow:hidden;}
.progress-bar > div{height:100%; background:var(--accent); border-radius:999px; transition:width .4s ease;}

.feed-item{display:flex; gap:10px; padding:12px 14px; align-items:center;}
.feed-item .icon-wrap{width:38px; height:38px; flex-shrink:0; border-radius:8px; overflow:hidden; background:var(--surface-2);}
.feed-item .f-main{flex:1; min-width:0;}
.feed-item .f-name{font-size:13px; font-weight:700;}
.feed-item .f-meta{font-size:11.5px; color:var(--ink-faint);}
.feed-item .f-dist{font-family:var(--font-mono); font-weight:700; color:var(--leaf); font-size:13px;}

/* ============ Walk screen ============ */
.walk-stage{
  display:flex; flex-direction:column; align-items:center; gap:var(--sp-4);
  padding:var(--sp-6) var(--sp-4); text-align:center; position:relative; overflow:hidden;
}
.walk-timer{font-family:var(--font-mono); font-size:44px; font-weight:700; letter-spacing:.02em;}
.walk-sub{font-size:12px; color:var(--ink-faint);}
.walk-metrics{display:flex; gap:var(--sp-6); margin-top:var(--sp-2);}
.walk-metrics div{display:flex; flex-direction:column; align-items:center;}
.walk-metrics .v{font-family:var(--font-mono); font-weight:700; font-size:18px; color:var(--accent-deep);}
.manual-dist{
  font-family:var(--font-mono); font-weight:700; font-size:18px; color:var(--accent-deep);
  width:74px; text-align:center; border:1px solid var(--border); border-radius:8px;
  background:var(--surface-2); padding:3px 4px;
}
.manual-dist:focus{outline:2px solid var(--accent); outline-offset:1px;}
.walk-metrics .k{font-size:10.5px; color:var(--ink-faint);}
.walk-actions{display:flex; gap:10px; margin-top:var(--sp-3);}
.gps-note{font-size:11px; color:var(--ink-faint); display:flex; align-items:center; gap:5px;}
.trail-row{display:flex; gap:5px; flex-wrap:wrap; justify-content:center; margin-top:2px;}
.trail-dot{width:18px; height:18px; display:block;}
.trail-dot svg{width:100%; height:100%;}
.gps-dot{width:7px; height:7px; border-radius:50%; background:var(--ink-faint); flex-shrink:0;}
.gps-dot.live{background:var(--leaf); box-shadow:0 0 0 3px color-mix(in srgb, var(--leaf) 25%, transparent);}

.badge-gallery{display:flex; gap:10px; overflow-x:auto; padding:4px 2px;}
.badge-item{flex-shrink:0; width:76px; text-align:center;}
.badge-item svg{width:76px; height:76px;}
.badge-item .b-dist{font-family:var(--font-mono); font-size:11px; font-weight:700; margin-top:2px;}
.badge-item .b-date{font-size:9.5px; color:var(--ink-faint);}

/* mission complete modal content */
.complete-wrap{text-align:center; padding:var(--sp-3) 0;}
.complete-wrap svg.badge-big{width:150px; height:150px; margin:0 auto;}
.complete-wrap h2{margin:var(--sp-3) 0 4px;}
.confetti-layer{position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:70;}
.confetti-piece{position:absolute; top:-10px; border-radius:2px; animation:fall linear forwards;}
@keyframes fall{ to{ transform:translateY(120vh) rotate(360deg); opacity:.2; } }
@media (prefers-reduced-motion: reduce){
  .confetti-piece{animation:none; display:none;}
  *{scroll-behavior:auto!important;}
}

/* ============ Discover screen ============ */
.map-frame{
  position:relative; border-radius:var(--radius-md); overflow:hidden; border:1px solid var(--border);
  aspect-ratio:1/0.95; box-shadow:var(--shadow-sm);
}
.map-frame svg{position:absolute; inset:0; width:100%; height:100%;}
.map-pin{
  position:absolute; transform:translate(-50%,-100%); width:30px; height:30px; cursor:pointer;
  border:none; background:none; padding:0; filter:drop-shadow(0 2px 3px rgba(0,0,0,.25));
}
.map-pin svg{width:100%; height:100%;}
.map-note{
  display:flex; gap:8px; align-items:flex-start; padding:10px 12px; font-size:11.5px; color:var(--ink-soft);
  background:var(--surface-2); border-radius:var(--radius-sm); border:1px solid var(--border);
}
.map-note svg{width:15px; height:15px; flex-shrink:0; margin-top:1px; color:var(--sky);}

.search-box{display:flex; align-items:center; gap:8px; border:1px solid var(--border); background:var(--surface); border-radius:999px; padding:9px 14px;}
.search-box svg{width:15px; height:15px; color:var(--ink-faint); flex-shrink:0;}
.search-box input{border:none; background:none; flex:1; font-size:13.5px; outline:none; color:var(--ink);}

.place-card{padding:13px 14px; display:flex; gap:12px;}
.place-card .icon-wrap{width:40px; height:40px; border-radius:12px; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
.place-card .icon-wrap svg{width:20px; height:20px;}
.place-card .p-main{flex:1; min-width:0;}
.place-card .p-name{font-weight:700; font-size:14px;}
.place-card .p-meta{font-size:11.5px; color:var(--ink-faint); margin-top:1px;}
.place-card .p-hours{font-size:11px; color:var(--ink-faint); margin-top:3px;}
.place-card .p-actions{display:flex; flex-direction:column; gap:6px; align-items:stretch; flex-shrink:0;}

/* ============ Friends screen ============ */
.profile-card{padding:0; overflow:hidden;}
.profile-card .p-head{display:flex; gap:12px; padding:14px 14px 10px; align-items:center;}
.profile-card .icon-wrap{width:52px; height:52px; flex-shrink:0; border-radius:10px; overflow:hidden; background:var(--surface-2);}
.profile-card .p-title{font-weight:700; font-size:15px;}
.profile-card .p-sub{font-size:11.5px; color:var(--ink-faint);}
.profile-card .p-bio{padding:0 14px; font-size:13px; color:var(--ink-soft);}
.profile-card .p-tags{display:flex; flex-wrap:wrap; gap:6px; padding:10px 14px 0;}
.profile-card .p-foot{display:flex; align-items:center; justify-content:space-between; padding:12px 14px 14px;}
.like-btn{
  display:flex; align-items:center; gap:6px; border:1px solid var(--border); background:var(--surface-2);

}
.like-btn svg{width:15px; height:15px;}
.like-btn[aria-pressed="true"]{background:var(--alert-soft); border-color:var(--alert); color:var(--alert);}
.like-btn[aria-pressed="true"] svg{fill:var(--alert);}

/* ============ Community screen ============ */
.post-card{padding:14px; display:flex; flex-direction:column; gap:8px;}
.post-card .p-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.post-card .p-title{font-weight:700; font-size:14.5px;}
.post-card .p-body{font-size:13px; color:var(--ink-soft);}
.post-card .p-foot{display:flex; align-items:center; gap:8px; font-size:11px; color:var(--ink-faint);}
.post-card .p-foot svg{width:12px; height:12px;}
.fab{
  position:absolute; right:var(--sp-4); bottom:96px; z-index:20;
  width:52px; height:52px; border-radius:50%; background:var(--accent-deep); color:#FFFBF3;
  border:none; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow); cursor:pointer;
}
.fab svg{width:22px; height:22px;}

.scroll-x{overflow-x:auto;}
#gmapCanvas{width:100%; height:100%;}

const ICON_FLOWER = svgWrap('<circle cx="12" cy="7.2" r="3" fill="currentColor"/><circle cx="16.8" cy="12" r="3" fill="currentColor"/><circle cx="12" cy="16.8" r="3" fill="currentColor"/><circle cx="7.2" cy="12" r="3" fill="currentColor"/><circle cx="12" cy="12" r="2.6" fill="var(--surface)"/>');
const ICON_BELL = svgWrap('<path d="M6 10.5a6 6 0 0 1 12 0c0 4 1.5 5.5 1.5 5.5h-15S6 14.5 6 10.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 19a2.2 2.2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>');
const ICON_DOWNLOAD = svgWrap('<path d="M12 4v11M7.5 11 12 15.5 16.5 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 19h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>');
const ICON_UPLOAD = svgWrap('<path d="M12 15V4M7.5 8 12 3.5 16.5 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 19h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>');

/* ============================================================

============================================================ */
const BREEDS = [

  {id:'frenchie', name:'法國鬥牛犬', nick:'阿鬥', fur:'#D9A468', furShade:'#B37F45', muzzle:'#3C312A', ear:'bat', mask:true},

function breedById(id){ return BREEDS.find(b=>b.id===id) || BREEDS[0]; }

/* real illustrated mascots (uploaded artifact assets), one per breed */
const BREED_IMG = {

/* ============================================================
   BADGE ART — procedurally generated walk-route badge
============================================================ */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function badgeTier(km){ if(km>=3.5) return {name:'盛開', color:'#C9A227', ring:'#C9A227'}; if(km>=1.5) return {name:'半開', color:'#7C8B96', ring:'#7C8B96'}; return {name:'花苞', color:'#A9784C', ring:'#A9784C'}; }
function flowerPetals(cx,cy,count,r,color,rot){
  let s='';
  for(let i=0;i<count;i++){
    const a = rot + (i/count)*Math.PI*2;
    const px = cx+Math.cos(a)*r, py = cy+Math.sin(a)*r;
    s += '<ellipse cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" rx="'+(r*0.6).toFixed(1)+'" ry="'+(r*0.36).toFixed(1)+'" fill="'+color+'" transform="rotate('+(a*180/Math.PI).toFixed(1)+' '+px.toFixed(1)+' '+py.toFixed(1)+')"/>';
  }
  return s;
}
function routeBadgeSVG(seed, km, big){
  const rnd = mulberry32(seed);
  const tier = badgeTier(km);
  const pts = [];
  const n = 6;
  for(let i=0;i<n;i++){
    const ang = (i/n)*Math.PI*2 + rnd()*0.8;
    const r = 20 + rnd()*13;
    pts.push([50+Math.cos(ang)*r, 62+Math.sin(ang)*r*0.7]);
  }
  let d = 'M '+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1)+' ';
  for(let i=1;i<pts.length;i++){ d += 'Q '+(pts[i][0]+ (rnd()-.5)*8).toFixed(1)+' '+(pts[i][1]+(rnd()-.5)*8).toFixed(1)+' '+pts[i][0].toFixed(1)+' '+pts[i][1].toFixed(1)+' '; }
  const petalCount = tier.name==='盛開'?8:(tier.name==='半開'?6:4);
  const petalR = tier.name==='盛開'?15:(tier.name==='半開'?12:8.5);
  const rot = rnd()*Math.PI*2;
  const sz = big? 150:76;
  return '<svg viewBox="0 0 100 100" width="'+sz+'" height="'+sz+'" xmlns="http://www.w3.org/2000/svg">'+
    '<circle cx="50" cy="50" r="46" fill="var(--surface-2)" stroke="'+tier.ring+'" stroke-width="3"/>'+
    '<path d="'+d+'" fill="none" stroke="var(--leaf)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity=".45"/>'+
    '<path d="M42 46 L42 30" stroke="var(--leaf)" stroke-width="2.4" stroke-linecap="round"/>'+
    '<path d="M42 38 Q34 36 32 42" stroke="var(--leaf)" stroke-width="1.8" fill="none" stroke-linecap="round"/>'+
    flowerPetals(42,30,petalCount,petalR,tier.color,rot)+
    '<circle cx="42" cy="30" r="'+(petalR*0.4).toFixed(1)+'" fill="var(--surface)" stroke="'+tier.color+'" stroke-width="1.4"/>'+
    '<circle cx="42" cy="30" r="'+(petalR*0.2).toFixed(1)+'" fill="'+tier.ring+'"/>'+
    '<text x="52" y="90" text-anchor="middle" font-size="9" font-weight="700" fill="var(--ink-soft)" font-family="JetBrains Mono, monospace">'+km.toFixed(1)+' KM</text>'+
  '</svg>';
}

/* ============================================================

============================================================ */
function renderScene(){

  document.getElementById('sceneWrap').innerHTML =
    '<svg viewBox="0 0 480 360" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">'+
      '<path d="M-10 190 L60 120 L130 200 L200 90 L280 190 L350 110 L430 195 L490 150 V360 H-10 Z" fill="var(--surface-3)" opacity=".45"/>'+
      '<path d="M0 260 Q120 210 240 250 T480 240 V360 H0 Z" fill="var(--surface-3)" opacity=".55"/>'+
      pines.join('')+
      '<path d="M0 300 Q120 270 240 296 T480 288 V360 H0 Z" fill="var(--surface-2)" opacity=".7"/>'+
      flowers.join('')+
    '</svg>';
}

let db = null;
async function initDb(){
  try{
    if(!window.firebase || !firebaseConfig || firebaseConfig.apiKey==='YOUR_API_KEY'){
      showConfigBanner('尚未設定 Firebase,目前資料只存在這台裝置(本機示範模式)。設定方法見 README-deploy.md。');
      return;
    }
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  }catch(e){ db = null; showConfigBanner('Firebase 連線失敗,目前資料只存在這台裝置。'); }
  if(!db) return;
  subscribe('profiles');
  subscribe('checkins');
}
function showConfigBanner(text){
  const b = document.createElement('div');
  b.style.cssText = 'position:fixed;left:0;right:0;bottom:0;background:#2E5233;color:#F3EFDC;font-size:11.5px;line-height:1.5;padding:9px 16px;text-align:center;z-index:999;';
  b.textContent = text;
  document.body.appendChild(b);
}

/* ============================================================
   GOOGLE MAPS — lazily loaded only once a real API key is set
============================================================ */
let gmapsState = 'idle';
function loadGoogleMaps(cb){
  if(window.google && window.google.maps){ gmapsState='ready'; cb(window.google); return; }
  if(!GOOGLE_MAPS_API_KEY || GOOGLE_MAPS_API_KEY === 'YOUR_GOOGLE_MAPS_API_KEY'){ gmapsState='unavailable'; cb(null); return; }
  if(gmapsState==='loading'){ setTimeout(function(){ loadGoogleMaps(cb); }, 250); return; }
  gmapsState = 'loading';
  const s = document.createElement('script');
  window.__onGmapsReady = function(){ gmapsState='ready'; cb(window.google); };
  s.src = 'https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(GOOGLE_MAPS_API_KEY)+'&loading=async&callback=__onGmapsReady';
  s.async = true;
  s.onerror = function(){ gmapsState='unavailable'; cb(null); };
  document.head.appendChild(s);
}
function subscribe(name){
  try{
    db.collection(name).orderBy('createdAt','desc').limit(60).onSnapshot(function(snap){
      if(!snap.empty){
        state[name] = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
        renderActive();
      }
    }, function(err){ /* keep local fallback */ });
  }catch(e){}
}
function dbAdd(coll, id, data){
  if(!db) return Promise.resolve(false);
  try{ return db.collection(coll).doc(id).set(data).then(()=>true).catch(()=>false); }
  catch(e){ return Promise.resolve(false); }
}
function dbUpdate(coll, id, data){
  if(!db) return Promise.resolve(false);
  try{ return db.collection(coll).doc(id).update(data).then(()=>true).catch(()=>false); }
  catch(e){ return Promise.resolve(false); }
}

  };
}
function updateStreakIfComplete(){
  const m = missionsStatus();
  const t = todayStr();
  if(m.walk && m.checkin && m.diary && lastStreakDate!==t){
    const yest = new Date(Date.now()-86400000).toISOString().slice(0,10);
    streak = (lastStreakDate===yest) ? streak+1 : 1;
    lastStreakDate = t;
    localStorage.setItem('ww_streak', String(streak));
    localStorage.setItem('ww_last_streak_date', lastStreakDate);
  }
}

function toast(msg){

  el.textContent = msg;
  el.classList.add('show');

function timeAgo(iso){
  const diff = Date.now() - new Date(iso).getTime();
  const h = Math.floor(diff/3600000);
  if(h<1) return Math.max(1,Math.floor(diff/60000))+' 分鐘前';
  if(h<24) return h+' 小時前';
  return Math.floor(h/24)+' 天前';
}
function fmtDate(iso){ const d = new Date(iso); return (d.getMonth()+1)+'/'+d.getDate(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function confetti(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  for(let i=0;i<26;i++){

function exportBackup(){
  const data = {
    exportedAt: new Date().toISOString(),
    profile: profile,
    diaryEntries: diaryEntries,
    checkins: state.checkins.filter(c=>c.ownerId===profile.id),
    likedProfiles: Array.from(likedSet),
    streak: streak,
    lastStreakDate: lastStreakDate,
    lastDiaryDate: lastDiaryDate
  };
  const filename = '汪汪日記備份-'+todayStr()+'.json';
  const jsonStr = JSON.stringify(data, null, 2);
  function fallbackDownload(){
    try{
      const blob = new Blob([jsonStr], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      toast('已匯出備份');
    }catch(e){ toast('匯出失敗'); }
  }
  if(typeof window.claude !== 'undefined' && window.claude.use){
    window.claude.use('downloads').then(function(downloads){
      if(downloads){ downloads.save({filename:filename, data:jsonStr}).then(function(){ toast('已匯出備份'); }).catch(fallbackDownload); }
      else { fallbackDownload(); }
    }).catch(fallbackDownload);
  } else {
    fallbackDownload();
  }
}
function importBackup(file){
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      if(Array.isArray(data.diaryEntries)){ diaryEntries = data.diaryEntries; saveDiaryEntries(); }
      if(Array.isArray(data.checkins)){
        const ids = new Set(state.checkins.map(c=>c.id));
        data.checkins.forEach(function(c){ if(!ids.has(c.id)){ state.checkins.unshift(c); ids.add(c.id); } });
      }
      if(Array.isArray(data.likedProfiles)){ data.likedProfiles.forEach(function(id){ likedSet.add(id); }); saveLikedSet(); }
      if(typeof data.streak === 'number'){ streak = data.streak; localStorage.setItem('ww_streak', String(streak)); }
      if(data.lastStreakDate){ lastStreakDate = data.lastStreakDate; localStorage.setItem('ww_last_streak_date', lastStreakDate); }
      if(data.lastDiaryDate){ lastDiaryDate = data.lastDiaryDate; localStorage.setItem('ww_last_diary_date', lastDiaryDate); }
      toast('備份已匯入!');
      renderActive();
      renderHeaderStreak();
    }catch(err){ toast('檔案格式錯誤,匯入失敗'); }
  };
  reader.readAsText(file);
}

let walkTimerState = { active:false, startTime:null, distanceKm:0, gpsLive:false, lastPos:null, watchId:null, routeId:null };
function completedRouteIds(){
  const s = new Set();
  state.checkins.forEach(function(c){ if(c.ownerId===profile.id && c.completed && c.routeId) s.add(c.routeId); });
  return s;
}

function haversineKm(a,b){
  const R=6371, toRad=d=>d*Math.PI/180;
  const dLat=toRad(b.lat-a.lat), dLon=toRad(b.lon-a.lon);
  const s = Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
}
function tryGeolocation(){
  if(!navigator.geolocation) return;
  try{
    walkTimerState.watchId = navigator.geolocation.watchPosition(function(pos){
      walkTimerState.gpsLive = true;
      const cur = {lat:pos.coords.latitude, lon:pos.coords.longitude};
      if(walkTimerState.lastPos){
        const d = haversineKm(walkTimerState.lastPos, cur);
        if(d>0.001 && d<0.3) walkTimerState.distanceKm += d;
      }
      walkTimerState.lastPos = cur;
      if(walkTimerState.active) renderWalk();
    }, function(){ walkTimerState.gpsLive = false; if(walkTimerState.active) renderWalk(); }, {enableHighAccuracy:true, maximumAge:4000, timeout:8000});
  }catch(e){}
}
function stopGeolocation(){
  if(walkTimerState.watchId!=null && navigator.geolocation){ try{ navigator.geolocation.clearWatch(walkTimerState.watchId); }catch(e){} }
  walkTimerState.watchId=null; walkTimerState.lastPos=null; walkTimerState.gpsLive=false;
}
function routeChipsHTML(){
  const w = walkTimerState;
  const locked = w.active;
  const done = completedRouteIds();
  let s = '<div class="chip-row">';
  s += '<button class="chip" data-route="" aria-pressed="'+(!w.routeId)+'" '+(locked?'disabled':'')+'>自由散步</button>';
  ROUTES.forEach(function(r){
    s += '<button class="chip" data-route="'+r.id+'" aria-pressed="'+(w.routeId===r.id)+'" '+(locked?'disabled':'')+'>'+esc(r.name)+' · '+r.km.toFixed(1)+'km'+(done.has(r.id)?' ✓':'')+'</button>';
  });
  s += '</div>';
  return s;
}
function routeMapSVG(route){

    '<path d="M-5 70 Q30 55 55 68 T110 60" stroke="var(--sky-soft)" stroke-width="9" fill="none" opacity=".9"/>'+
    '<circle cx="46" cy="20" r="14" fill="var(--leaf-soft)"/><circle cx="14" cy="82" r="16" fill="var(--leaf-soft)"/>';
  let path;

    path = '<circle cx="'+route.sx+'" cy="'+route.sy+'" r="16" fill="none" stroke="var(--accent-deep)" stroke-width="2" stroke-dasharray="4 3"/>';
  } else {
    const mx = (route.sx+route.ex)/2 + (route.sy-route.ey)*0.25;
    const my = (route.sy+route.ey)/2 + (route.ex-route.sx)*0.25;
    path = '<path d="M'+route.sx+' '+route.sy+' Q'+mx+' '+my+' '+route.ex+' '+route.ey+'" fill="none" stroke="var(--accent-deep)" stroke-width="2" stroke-dasharray="4 3"/>';
  }

  const endPin = route.loop ? '' : '<circle cx="'+route.ex+'" cy="'+route.ey+'" r="4.2" fill="var(--rust)" stroke="var(--surface)" stroke-width="1.4"/>';
  return '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">'+bg+path+startPin+endPin+'</svg>';

        new g.maps.Polyline({path:[start,end], map:map, strokeColor:'#2E5233', strokeWeight:4, strokeOpacity:.85});
        const bounds = new g.maps.LatLngBounds(); bounds.extend(start); bounds.extend(end); map.fitBounds(bounds, 48);
      } else {

function trailDotsHTML(km, target){
  target = target || 3.5;
  const N = 10, filled = Math.min(N, Math.round((km/target)*N));
  let s='';
  for(let i=0;i<N;i++){ s += '<span class="trail-dot">'+flowerDotSVG(i<filled)+'</span>'; }
  return s;
}

function finishWalk(){
  const manualInput = document.getElementById('manualDist');
  if(manualInput){ const v = parseFloat(manualInput.value); walkTimerState.distanceKm = isNaN(v)?0:v; }

  const route = routeById(walkTimerState.routeId);
  if(walkTimerState.distanceKm<=0){ toast('請開啟定位或輸入這次走了幾公里'); return; }
  const distanceKm = +walkTimerState.distanceKm.toFixed(2);
  const durationMin = Math.max(1, Math.round((Date.now()-walkTimerState.startTime)/60000));
  const completed = route ? distanceKm >= route.km : true;
  const id = 'checkin-'+profile.id+'-'+Date.now();
  const rec = {id, ownerId:profile.id, dogName:profile.dogName, breed:profile.breed, distanceKm, durationMin,
    routeId: route ? route.id : null, routeName: route ? route.name : null, routeKm: route ? route.km : null, completed,
    note: route ? (completed ? '完成路線任務:'+route.name : '挑戰路線:'+route.name+'(未達目標)') : '今日散步打卡',
    createdAt:new Date().toISOString()};
  state.checkins.unshift(rec);
  dbAdd('checkins', id, {ownerId:rec.ownerId, dogName:rec.dogName, breed:rec.breed, distanceKm:rec.distanceKm, durationMin:rec.durationMin,
    routeId:rec.routeId, routeName:rec.routeName, routeKm:rec.routeKm, completed:rec.completed, note:rec.note, createdAt:rec.createdAt});
  updateStreakIfComplete();
  walkTimerState = { active:false, startTime:null, distanceKm:0, gpsLive:false, lastPos:null, watchId:null, routeId:null };
  openCompleteModal(rec);
  renderHeaderStreak();
}

      '<rect x="65" y="10" width="10" height="14" rx="1.5"/><rect x="78" y="16" width="9" height="12" rx="1.5"/>'+
      '<rect x="8" y="16" width="9" height="11" rx="1.5"/><rect x="60" y="72" width="11" height="15" rx="1.5"/>'+
      '<rect x="78" y="76" width="9" height="10" rx="1.5"/>'+
    '</g>'+
    '<path d="M20 5 Q40 40 60 50 T90 95" stroke="var(--border)" stroke-width="2.2" fill="none" stroke-dasharray="1 5" stroke-linecap="round"/>'+
  '</svg>';
}

/* ============================================================
   RENDER: FRIENDS
============================================================ */
function renderFriends(){
  const el = document.getElementById('screenFriends');
  const cats = [['all','全部']].concat(DISTRICTS.map(d=>[d,d]));
  const filtered = state.profiles.filter(p=> state.friendsCat==='all' || p.district===state.friendsCat);
  el.innerHTML =
    '<div class="screen-title"><h1>毛孩交友</h1><button class="btn btn-primary btn-sm" id="btnNewProfile">建立我的檔案</button></div>'+
    '<div class="screen-sub">依社區認識附近狗友,一起揪散步或聚會</div>'+
    '<div class="chip-row">'+cats.map(function(c){ return '<button class="chip" data-fcat="'+c[0]+'" aria-pressed="'+(state.friendsCat===c[0])+'">'+c[1]+'</button>'; }).join('')+'</div>'+
    '<div style="display:flex;flex-direction:column;gap:12px;">'+
      (filtered.length? filtered.map(profileCardHTML).join('') : '<div class="empty-note">這個地區還沒有毛孩檔案,當第一個吧!</div>')+
    '</div>';
  el.querySelectorAll('[data-fcat]').forEach(function(b){ b.onclick=function(){ state.friendsCat=b.dataset.fcat; renderFriends(); }; });
  document.getElementById('btnNewProfile').onclick = openProfileForm;
  el.querySelectorAll('[data-like]').forEach(function(b){ b.onclick=function(){ likeProfile(b.dataset.like); }; });
}
function profileCardHTML(p){
  const liked = likedSet.has(p.id);
  return '<div class="card profile-card">'+
    '<div class="p-head"><div class="icon-wrap">'+dogSVG(p.breed)+'</div>'+
      '<div><div class="p-title">'+esc(p.dogName)+' · '+breedById(p.breed).name+'</div>'+
      '<div class="p-sub">'+p.district+' · 飼主：'+esc(p.ownerAlias)+'</div></div></div>'+
    '<div class="p-bio">'+esc(p.bio)+'</div>'+
    '<div class="p-tags">'+(p.tags||[]).map(t=>'<span class="tag" style="background:var(--surface-2);color:var(--ink-soft);">'+esc(t)+'</span>').join('')+'</div>'+
    '<div class="p-foot"><span style="font-size:11.5px;color:var(--ink-faint);">'+timeAgo(p.createdAt)+'加入</span>'+
      '<button class="like-btn" data-like="'+p.id+'" aria-pressed="'+liked+'" '+(liked?'disabled':'')+'>'+ICON_HEART_SM+' '+(p.likes||0)+'</button></div>'+
  '</div>';
}
function likeProfile(id){
  if(likedSet.has(id)) return;
  const p = state.profiles.find(x=>x.id===id);
  if(!p) return;
  likedSet.add(id); saveLikedSet();
  p.likes = (p.likes||0)+1;
  dbUpdate('profiles', id, {likes:p.likes});
  lastLikeDate = todayStr();
  localStorage.setItem('ww_last_like_date', lastLikeDate);
  updateStreakIfComplete();
  toast('已送出邀約!今日任務 +1');
  renderActive();
  renderHeaderStreak();
}
function openProfileForm(){
  showModal(
    '<div class="modal-head"><h2>建立我的檔案</h2><button class="icon-btn" id="mClose">'+ICON_X+'</button></div>'+
    '<div class="field"><label>毛孩名字</label><input type="text" id="fDogName" value="'+esc(profile.dogName)+'"></div>'+
    '<div class="field"><label>所在地區</label><select id="fDistrict">'+DISTRICTS.map(d=>'<option '+(d===profile.district?'selected':'')+'>'+d+'</option>').join('')+'</select></div>'+
    '<div class="field"><label>個性標籤(最多選4個)</label><div class="tagpick" id="fTags">'+TAG_OPTIONS.map(t=>'<button type="button" class="chip" data-tag="'+t+'" aria-pressed="false">'+t+'</button>').join('')+'</div></div>'+
    '<div class="field"><label>自我介紹</label><textarea id="fBio" rows="3" placeholder="介紹一下'+esc(profile.dogName)+'的個性、喜好…"></textarea></div>'+
    '<button class="btn btn-primary btn-block" id="fSubmit">發布檔案</button>'
  );
  document.getElementById('mClose').onclick = closeModal;
  const picked = new Set();
  document.querySelectorAll('#fTags [data-tag]').forEach(function(b){
    b.onclick = function(){
      if(picked.has(b.dataset.tag)){ picked.delete(b.dataset.tag); b.setAttribute('aria-pressed','false'); }
      else if(picked.size<4){ picked.add(b.dataset.tag); b.setAttribute('aria-pressed','true'); }
    };
  });
  document.getElementById('fSubmit').onclick = function(){
    const dogName = document.getElementById('fDogName').value.trim() || profile.dogName;
    const district = document.getElementById('fDistrict').value;
    const bio = document.getElementById('fBio').value.trim() || '這位毛孩還很神秘,等你來認識。';
    const id = 'profile-'+profile.id;
    const rec = {id, dogName, breed:profile.breed, district, tags:Array.from(picked), bio, ownerAlias:profile.ownerAlias, likes:0, createdAt:new Date().toISOString()};
    state.profiles = state.profiles.filter(p=>p.id!==id);
    state.profiles.unshift(rec);
    dbAdd('profiles', id, rec);
    toast('檔案已發布!');
    closeModal();
    renderActive();
  };
}

/* ============================================================
   RENDER: DIARY (private, device-only notes)
============================================================ */
function renderCommunity(){
  const el = document.getElementById('screenCommunity');
  const cats = [['all','全部'],['health','健康提醒'],['safety','安全紀錄'],['activity','活動筆記'],['daily','日常記事']];
  const filtered = diaryEntries.filter(d=> state.diaryCat==='all' || d.category===state.diaryCat);
  el.innerHTML =
    '<div class="screen-title"><h1>我的日記</h1></div>'+
    '<div class="screen-sub">只有這台裝置看得到。可記錄提醒、發現與毛孩日常。</div>'+
    '<div class="chip-row">'+cats.map(function(c){ return '<button class="chip" data-dcat="'+c[0]+'" aria-pressed="'+(state.diaryCat===c[0])+'">'+c[1]+'</button>'; }).join('')+'</div>'+
    '<div style="display:flex;flex-direction:column;gap:10px;">'+
      (filtered.length? filtered.map(diaryCardHTML).join('') : '<div class="empty-note">還沒有筆記,按右下角的＋新增第一則。</div>')+
    '</div>';
  el.querySelectorAll('[data-dcat]').forEach(function(b){ b.onclick=function(){ state.diaryCat=b.dataset.dcat; renderCommunity(); }; });
  el.querySelectorAll('[data-del-diary]').forEach(function(b){ b.onclick=function(){ deleteDiaryEntry(b.dataset.delDiary); }; });
}
function diaryCardHTML(d){
  return '<div class="card post-card">'+
    '<div class="p-top"><span class="tag tag-diary-'+d.category+'">'+DIARY_CAT_LABEL[d.category]+'</span>'+
      '<button class="icon-btn" style="width:26px;height:26px;margin-left:auto;" data-del-diary="'+d.id+'" title="刪除">'+ICON_X+'</button></div>'+
    '<div class="p-body">'+esc(d.text)+'</div>'+
    '<div class="p-foot">'+ICON_PIN_SM+'<span>'+esc(profile.dogName)+'</span><span style="margin-left:auto;">'+timeAgo(d.createdAt)+'</span></div>'+
  '</div>';
}
function openPostForm(){
  showModal(
    '<div class="modal-head"><h2>新增日記</h2><button class="icon-btn" id="mClose">'+ICON_X+'</button></div>'+
    '<div class="field"><label>分類</label><select id="pCat"><option value="health">健康提醒</option><option value="safety">安全紀錄</option><option value="activity">活動筆記</option><option value="daily">日常記事</option></select></div>'+
    '<div class="field"><label>內容</label><textarea id="pBody" rows="4" placeholder="記下提醒、發現或今天的小插曲…"></textarea></div>'+
    '<button class="btn btn-primary btn-block" id="pSubmit">儲存</button>'
  );
  document.getElementById('mClose').onclick = closeModal;
  document.getElementById('pSubmit').onclick = function(){
    const text = document.getElementById('pBody').value.trim();
    if(!text){ toast('請先寫點內容'); return; }
    const id = 'diary-'+Date.now();
    diaryEntries.unshift({id, category:document.getElementById('pCat').value, text, createdAt:new Date().toISOString()});
    saveDiaryEntries();
    lastDiaryDate = todayStr();
    localStorage.setItem('ww_last_diary_date', lastDiaryDate);
    updateStreakIfComplete();
    toast('日記已儲存!今日任務 +1');
    closeModal();
    renderActive();
    renderHeaderStreak();
  };
}
function deleteDiaryEntry(id){
  diaryEntries = diaryEntries.filter(d=>d.id!==id);
  saveDiaryEntries();
  renderActive();
}

/* ============================================================
   MODAL / TOAST helpers
============================================================ */
function showModal(html){
  document.getElementById('modalSheet').innerHTML = html;
  document.getElementById('modalBackdrop').classList.add('show');
}
function closeModal(){ document.getElementById('modalBackdrop').classList.remove('show'); }
document.getElementById('modalBackdrop').addEventListener('click', function(e){ if(e.target===this) closeModal(); });

/* ============================================================
   NAV / HEADER
============================================================ */
function renderHeaderStreak(){
  document.getElementById('streakPill').innerHTML = ICON_FLAME + ' ' + streak;
  const bell = document.getElementById('bellBtn');
  if(bell && !bell.innerHTML){ bell.innerHTML = ICON_BELL; bell.onclick = openNotifications; }
}
function openNotifications(){
  const m = missionsStatus();
  const pending = [];
  if(!m.walk) pending.push('還沒開始今天的散步,到「散步打卡」出發吧!');
  if(!m.checkin) pending.push('還沒打卡任何地點,到「地點」探索附近店家。');
  if(!m.diary) pending.push('今天還沒寫日記,記錄一下毛孩的日常吧。');
  showModal(
    '<div class="modal-head"><h2>通知</h2><button class="icon-btn" id="mClose">'+ICON_X+'</button></div>'+
    (pending.length
      ? '<div style="display:flex;flex-direction:column;gap:8px;">'+pending.map(function(t){ return '<div class="card map-note">'+ICON_INFO+'<span>'+t+'</span></div>'; }).join('')+'</div>'
      : '<div class="empty-note">今天的任務都完成了,棒!沒有新通知。</div>')
  );
  document.getElementById('mClose').onclick = closeModal;
}
function setActiveTab(tab){
  state.activeTab = tab;
  ['home','walk','discover','community'].forEach(function(t){
    document.getElementById('screen'+t.charAt(0).toUpperCase()+t.slice(1)).hidden = (t!==tab);
  });
  document.querySelectorAll('.nav-btn').forEach(function(b){ b.setAttribute('aria-current', b.dataset.nav===tab ? 'true':'false'); });
  const fab = document.getElementById('fabBtn');
  if(fab) fab.remove();
  if(tab==='community'){
    const btn = document.createElement('button');
    btn.className='fab'; btn.id='fabBtn'; btn.innerHTML = ICON_PLUS; btn.title='新增日記';
    btn.onclick = openPostForm;
    document.getElementById('appShell').appendChild(btn);
  }
  renderActive();
}
function renderActive(){
  if(!profile) return;
  ({home:renderHome, walk:renderWalk, discover:renderDiscover, community:renderCommunity})[state.activeTab]();
}
document.querySelectorAll('.nav-btn').forEach(function(b, i){
  const names = ['home','walk','discover','community'];
  b.querySelector('.ic').innerHTML = iconMarkup(names[i]);
  b.onclick = function(){ setActiveTab(b.dataset.nav); };
});

/* ============================================================
   ONBOARDING
============================================================ */
function renderOnboard(prefill){
  const el = document.getElementById('onboardScreen');
  const p = prefill || {};
  let chosenBreed = p.breed || null;
  el.innerHTML =
    '<div class="onboard-hero"><div class="mascot-wrap" id="obMascot"></div>'+
      '<h1>'+(prefill?'編輯毛孩檔案':'歡迎加入汪汪日記')+'</h1>'+
      '<p>選一隻最像你家毛孩的角色,開始每日散步打卡、探索友善地圖,認識附近的狗友。</p></div>'+
    '<div class="section-label" style="margin-bottom:8px;">選擇品種</div>'+
    '<div class="breed-grid" id="obBreedGrid">'+BREEDS.map(function(b){
      return '<button type="button" class="breed-card" data-breed="'+b.id+'" aria-pressed="'+(b.id===chosenBreed)+'"><div class="icon-wrap">'+dogSVG(b.id)+'</div><span>'+b.name+'</span></button>';
    }).join('')+'</div>'+
    '<div class="field"><label>幫毛孩取名字</label><input type="text" id="obName" value="'+esc(p.dogName||'')+'" placeholder="例如：小柴"></div>'+
    '<div class="field"><label>所在地區</label><select id="obDistrict">'+DISTRICTS.map(d=>'<option '+(d===p.district?'selected':'')+'>'+d+'</option>').join('')+'</select></div>'+
    '<div class="field"><label>你的暱稱(交友牆顯示)</label><input type="text" id="obAlias" value="'+esc(p.ownerAlias||'')+'" placeholder="例如：柴語者"></div>'+
    '<button class="btn btn-primary btn-block" id="obSubmit">'+(prefill?'儲存變更':'開始使用')+'</button>'+
    (prefill? '<button class="btn btn-ghost btn-block" id="obCancel" style="margin-top:8px;">取消</button>' : '');

  function paintMascot(){ document.getElementById('obMascot').innerHTML = dogSVG(chosenBreed||'shiba'); }
  paintMascot();
  el.querySelectorAll('[data-breed]').forEach(function(card){
    card.onclick = function(){
      chosenBreed = card.dataset.breed;
      el.querySelectorAll('[data-breed]').forEach(c=>c.setAttribute('aria-pressed', c===card));
      if(!document.getElementById('obName').value){ document.getElementById('obName').placeholder = breedById(chosenBreed).nick; }
      paintMascot();
    };
  });
  if(prefill){ document.getElementById('obCancel').onclick = function(){ el.hidden = true; }; }
  document.getElementById('obSubmit').onclick = function(){
    const dogName = document.getElementById('obName').value.trim() || breedById(chosenBreed||'shiba').nick;
    if(!chosenBreed){ toast('請先選擇品種'); return; }
    const district = document.getElementById('obDistrict').value;
    const ownerAlias = document.getElementById('obAlias').value.trim() || (dogName+'的家人');
    profile = Object.assign({}, profile, { id: (profile&&profile.id) || ('owner-'+Math.random().toString(36).slice(2,10)), breed:chosenBreed, dogName, district, ownerAlias });
    saveJSON('ww_profile', profile);
    el.hidden = true;
    finishBoot();
  };
}

/* ============================================================
   BOOT
============================================================ */
function paintAvatar(){
  document.getElementById('avatarBtn').innerHTML = dogSVG(profile.breed);
  document.getElementById('avatarBtn').onclick = function(){
    document.getElementById('onboardScreen').hidden = false;
    renderOnboard(profile);
  };
}
function finishBoot(){
  paintAvatar();
  renderHeaderStreak();
  setActiveTab('home');
}
function boot(){
  renderScene();
  if(!profile){
    document.getElementById('onboardScreen').hidden = false;
    renderOnboard(null);
  } else {
    finishBoot();
  }
  initDb();
}
boot();

})();
</script>
